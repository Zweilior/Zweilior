<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Muhammad Arif Saputra - Information Systems Student" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="150" y="150" height="40" width="0">
        <animate attributeName="width" values="0;600;600;0" keyTimes="0;0.45;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- grid dots -->
  <g fill="#2dd4bf" opacity="0.12">
    <circle cx="60" cy="50" r="2"/><circle cx="140" cy="90" r="2"/><circle cx="220" cy="40" r="2"/>
    <circle cx="700" cy="60" r="2"/><circle cx="780" cy="100" r="2"/><circle cx="840" cy="45" r="2"/>
    <circle cx="520" cy="35" r="2"/><circle cx="610" cy="95" r="2"/>
  </g>

  <!-- floating particles -->
  <g fill="#67e8f9">
    <circle cx="90" cy="220" r="3" opacity="0.7">
      <animate attributeName="cy" values="230;40;230" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="230" r="2" opacity="0.7">
      <animate attributeName="cy" values="240;60;240" dur="7s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="230" r="3" opacity="0.7">
      <animate attributeName="cy" values="240;30;240" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="230" r="2.5" opacity="0.7">
      <animate attributeName="cy" values="240;50;240" dur="8s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="230" r="3" opacity="0.7">
      <animate attributeName="cy" values="240;70;240" dur="10s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating code symbols -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="34" fill="#2dd4bf" opacity="0.35">
    <text x="50" y="140">
      &lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="790" y="120">
      { }
      <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- waves (seamless loop: path period 450px, translate -450) -->
  <g>
    <path fill="url(#waveB)" d="M0 215 Q 112 180 225 215 T 450 215 T 675 215 T 900 215 T 1125 215 T 1350 215 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#waveA)" d="M0 238 Q 112 205 225 238 T 450 238 T 675 238 T 900 238 T 1125 238 T 1350 238 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <text x="450" y="115" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="44" font-weight="700" fill="url(#title)" opacity="0">
    Muhammad Arif Saputra
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.2s" fill="freeze"/>
  </text>

  <!-- typing subtitle -->
  <g clip-path="url(#typeClip)">
    <text x="450" y="178" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" fill="#5eead4">
      &gt; Information Systems @ ITK | Aspiring Developer
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="150" y="158" width="10" height="24" fill="#99f6e4">
    <animate attributeName="x" values="150;750;750;150" keyTimes="0;0.45;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
